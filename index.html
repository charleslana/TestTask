<!DOCTYPE html>
<html data-theme="dark">

<head>
    <meta charset="UTF-8">
    <title>Teste Automatizado</title>
    <link rel="stylesheet" href="bulma.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="app">
        <nav class="navbar" role="navigation" aria-label="main navigation">
            <div class="navbar-brand">
                <p class="navbar-item">TestTask</p>

                <a role="button" class="navbar-burger" aria-label="menu" aria-expanded="false"
                    data-target="navbarBasicExample" @click="toggleMenu">
                    <span aria-hidden="true"></span>
                    <span aria-hidden="true"></span>
                    <span aria-hidden="true"></span>
                    <span aria-hidden="true"></span>
                </a>
            </div>

            <div id="navbarBasicExample" class="navbar-menu">
                <div class="navbar-start">
                    <a class="navbar-item">Criar Workspace</a>
                    <a class="navbar-item">Importar Workspace</a>

                    <div class="navbar-item has-dropdown is-hoverable">
                        <a class="navbar-link">Testes</a>
                        <div class="navbar-dropdown">
                            <a class="navbar-item is-selected">Criar teste E2E</a>
                            <a class="navbar-item">Criar teste API</a>
                            <hr class="navbar-divider">
                            <a class="navbar-item">Exportar Relatório</a>
                        </div>
                    </div>
                </div>

                <div class="navbar-end">
                    <div class="navbar-item">
                        <div class="buttons">
                            <a class="button is-primary"><strong>Configurações</strong></a>
                            <a class="button is-light" @click="showAbout">Sobre</a>
                        </div>
                    </div>
                </div>
            </div>
        </nav>
        <div class="container my-5">
            <div class="columns">
                <div class="column is-three-fifths has-text-centered">
                    <div class="is-size-3 mb-5">Teste E2E</div>
                    <!--<div v-for="i in 100" :key="i">Teste {{i}}</div>-->
                    <div class="box mb-5">
                        <div class="field is-horizontal">
                            <div class="field-label is-normal">
                                <label class="label">Digite uma URL</label>
                            </div>
                            <div class="field-body">
                                <div class="field">
                                    <p class="control">
                                        <input class="input is-medium is-shadowless" type="text"
                                            placeholder="Exemplo: https://exemplo.com" v-model.trim="test.url" />
                                    </p>
                                </div>
                            </div>
                        </div>
                        <button class="button is-small">Ou use urls cadastradas</button>
                    </div>
                    <div class="box">
                        <button class="button is-medium" :disabled="!test.url" @click="toggleModalAction">Adicionar
                            Ações</button>
                    </div>
                </div>
                <div class="column has-text-centered">
                    <button class="button is-primary is-large mb-5 floating-start-btn" @click="startTest"
                        :disabled="isDisabled || !test.url">Iniciar o teste</button>
                    <div class="is-flex is-justify-content-center" v-if="testNotification">
                        <article :class="testFail ? 'message is-danger' : 'message is-success'">
                            <div class="message-header">
                                <p>{{ testFail ? 'Erro!' : 'Sucesso!' }}</p>
                                <button class="delete" aria-label="delete" @click="testNotification = false"></button>
                            </div>
                            <div class="message-body">
                                <p class="has-text-weight-bold mb-2" v-if="testFail">O teste falhou! <br />{{testFail}}
                                </p>
                                <p class="has-text-weight-bold mb-2" v-else>O Teste foi executado com sucesso!</p>
                                <button class="button" :class="testFail ? 'is-danger' : 'is-success'">Ver
                                    resultados</button>
                            </div>
                        </article>
                    </div>
                </div>
            </div>
        </div>
        <!-- Modal actions -->
        <div class="modal" :class="{ 'is-active': modalAction }">
            <div class="modal-background" @click="toggleModalAction"></div>
            <div class="modal-card" @click.stop>
                <header class="modal-card-head">
                    <p class="modal-card-title">Ações</p>
                    <button class="delete" aria-label="close" @click="toggleModalAction"></button>
                </header>
                <section class="modal-card-body">
                    <input class="input is-medium mb-5 is-shadowless" type="text" placeholder="Pesquisar ações"
                        v-model="searchTerm" />
                    <div class="card mb-5 is-clickable" v-for="(action, index) in filteredActions" :key="index">
                        <div class="card-content">
                            <div class="content is-size-3 has-text-weight-bold has-text-centered">
                                {{ action.name }}
                            </div>
                        </div>
                    </div>
                </section>
                <footer class="modal-card-foot">
                    <div class="buttons">
                        <button class="button" @click="toggleModalAction">Cancelar</button>
                    </div>
                </footer>
            </div>
        </div>
        <!-- -->
    </div>
    <script src="vue@2.js"></script>
    <script src="script.js"></script>
</body>

</html>
